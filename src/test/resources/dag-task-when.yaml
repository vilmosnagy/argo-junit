apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: dag-task-when-
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: mode
        value: "a"
  templates:

  - name: main
    dag:
      tasks:
      - name: run-a
        template: report
        when: '"{{workflow.parameters.mode}}" == "a"'
        arguments:
          parameters:
            - name: label
              value: "ran-a"
      - name: run-b
        template: report
        when: '"{{workflow.parameters.mode}}" == "b"'
        arguments:
          parameters:
            - name: label
              value: "ran-b"

  - name: report
    inputs:
      parameters:
        - name: label
    container:
      image: busybox
      command: [sh, -c]
      args: ["echo {{inputs.parameters.label}}"]
