apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: workflow-timing-vars-
spec:
  entrypoint: main
  onExit: on-exit
  templates:
  - name: main
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo main done"]

  - name: on-exit
    steps:
    - - name: report
        template: print-timing
        arguments:
          parameters:
          - name: creationTimestamp
            value: '{{workflow.creationTimestamp}}'
          - name: durationSeconds
            value: '{{workflow.duration}}'

  - name: print-timing
    inputs:
      parameters:
      - name: creationTimestamp
      - name: durationSeconds
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo ts={{inputs.parameters.creationTimestamp}} dur={{inputs.parameters.durationSeconds}}"]
