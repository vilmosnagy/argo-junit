apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: unlimited-retry-
spec:
  entrypoint: main
  # templateDefaults limit should act as a safety net
  templateDefaults:
    retryStrategy:
      limit: "2"
  templates:

  - name: main
    dag:
      tasks:
      - name: run
        template: process

  - name: process
    retryStrategy:
      retryPolicy: Always
      # limit intentionally omitted (simulates an unresolved merge-key anchor)
    container:
      image: busybox
      command: [sh, -c]
      args: ["exit 1"]
