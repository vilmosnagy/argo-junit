apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: workflow-timing-vars-
spec:
  entrypoint: main
  onExit: on-exit
  arguments:
    parameters:
    - name: release_port
      value: "0"
  templates:
  - name: main
    script:
      image: python:alpine3.23
      command: [python3]
      source: |
        import urllib.request, time
        while True:
            try:
                urllib.request.urlopen(
                    'http://host.testcontainers.internal:{{workflow.parameters.release_port}}/ready',
                    timeout=1)
                break
            except Exception:
                pass
            time.sleep(0.1)

  - name: on-exit
    steps:
    - - name: report
        template: print-timing
        arguments:
          parameters:
          - name: creationTimestamp
            value: '{{workflow.creationTimestamp}}'
          - name: durationSeconds
            value: '{{workflow.duration}}'

  - name: print-timing
    inputs:
      parameters:
      - name: creationTimestamp
      - name: durationSeconds
    container:
      image: alpine:3.23
      command: [sh, -c]
      args: ["echo ts={{inputs.parameters.creationTimestamp}} dur={{inputs.parameters.durationSeconds}}"]
