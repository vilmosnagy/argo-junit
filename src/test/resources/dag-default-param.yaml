apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: dag-default-param-
spec:
  entrypoint: main
  templates:

  - name: main
    dag:
      tasks:
      - name: run
        template: formatter
        arguments:
          parameters:
            - name: items
              value: "a b c"
        # separator intentionally omitted — should use template default ", "

  - name: formatter
    inputs:
      parameters:
        - name: items
        - name: separator
          value: ", "
    container:
      image: busybox
      command: [sh, -c]
      args: ["echo '{{inputs.parameters.items}}' | sed 's/ /{{inputs.parameters.separator}}/g'"]
