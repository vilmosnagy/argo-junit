name: CI Build
on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
      - name: Install argo CLI
        run: |
          curl -sL https://github.com/argoproj/argo-workflows/releases/download/v3.7.6/argo-linux-amd64.gz | gunzip > /usr/local/bin/argo
          chmod +x /usr/local/bin/argo
      - name: Build
        run: mvn --batch-mode --update-snapshots verify
      - name: Upload JaCoCo Coverage Report as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: ${{ github.workspace }}/target/site/jacoco/
          retention-days: 30
      - name: Check if JaCoCo CSV exists
        id: check-jacoco
        run: |
          if [ -f "target/site/jacoco/jacoco.csv" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Add JaCoCo Coverage to Action Summary
        if: steps.check-jacoco.outputs.exists == 'true'
        uses: jjmrocha/jacoco-summary@v1.1.1
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv